<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page title</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
/>
</head>
<style>
    *{
        padding:0;
        margin:0;
        box-sizing:border-box;
         font-family: 'Poppins', serif;
    }
   body{
       background:whitesmoke;
   }
   
    
     .about-section{
            background:white;
            margin:1rem 0;
        }
    .about{
        max-width:868px;
        margin:auto;
        display:flex;
        flex-wrap:wrap;
        justify-content: center;
        align-items:center;
        padding:1.5rem 0.3rem;
    }
   
    .about .image{
        width:300px;
        
    }
    .about .image img{
        height:300px;
        width:100%;
        object-fit:cover;
        border-radius:50%;
        padding:0.5rem;
        
        }
        
        
        
        .about .content{
            width:400px;
            text-align:center;
            
        }
        .about .content h1{
            font-weight:900;
        }
        .about .content p{
           
            font-weight:300;
            font-size:1.5rem;
        }
        
        .icons{
            margin:0.5rem 0.3rem;
            border-radius:15px;
        }
        .icon{
            padding:0.2rem 0.5rem;
            box-shadow: 0 7px 15px 0 rgba(0, 0, 0, .13), 0 1px 4px 0 rgba(0, 0, 0, .11);
            
            font-size:29px;
            border-radius:5px;
            margin:0.1rem 0.3rem;
            background:white;
            color:black;
            background:black;
            color:white;
        }
        .icon:hover{
            
             background:white;
            color:black;
            transition:0.1s;
            
        }
        .about-me{
            max-width:868px;
            margin:auto;
            display:flex;
            flex-wrap:wrap-reverse;
            justify-content: center;
            align-items:center;
            padding:1.5rem 0.3rem;
        }
       .about-me .image{
           width:350px;
       }
       .about-me img{
           width:100%;
           height:350px;
           border-radius:0.5rem;
       }
       .about-me .content{
           width:400px;
           padding:0.5rem;
       }
       
        
</style>
<body>
 <div class="about-section">
     <div class="about">
         <div class="image">
             <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgVWOrDwkWfVnmmB1FJN4btv5ddwK4J619KQ&usqp=CAU" alt="image not found">
         </div>
         <div class="content">
             <p>Hey ,  I am </p>
             <h1>Priyanshu Singh</h1>
             <h2>A Freelancer</h2>
            
             <div class="icons">
                 <i class="ri-github-fill icon"></i>
                 <i class="ri-instagram-fill icon"></i>
                 <i class="ri-linkedin-box-fill icon"></i>
                 <i class="ri-facebook-fill icon"></i>
             </div>
         </div>
     </div>
 </div>
 
 <div class="about-section">
    <div class="about-me">
        
        <div class="content">
            <h1>ABOUT ME</h1>
            <p>I am a student.MY name is.priyanshu singh and i a web developer designer and app developer.I build a beautiful unique best website and sell to the client.</p>
        </div>
        <div class="image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5XdHAK_Nj3M8FKhVOjUZkGKkUjRq65iBHGQ&usqp=CAU" alt="">
        </div>
    </div>
 </div>
 
 
 
</body>
</html>
