<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Browser</title>
    <link rel="stylesheet" href="style.css">
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <p>Banking system </p>
  </header>
  
<div class="creating-account">
      <h3>Creating a new account</h3>
      
      <label for="name" id="label">User name</label>
    <input type="text" placeholder="Enter name" name="name" id="name">
    
    <br>
    
    <label for="money" id="label">First transaction</label>
    <input type="number" placeholder="Amount of money" name="money" id="money">
    <br>
   <div class="btn">
      <button class="create-btn">Create </button>
   </div>
</div>
<br> 
<br>
<br> 
<br>
<br> 
<br>
<br> 
<br>



<div class="updating-account">
  <h3>Updating a new account</h3>
      
      <label for="accountNumber" id="label">Account number</label>
    <input type="number" placeholder="Enter account Number" name="accountNumber" id="accountNumber">
    
    <br>
    
    <label for="deposit" id="label">Deposit</label>
    <input type="number" placeholder="Amount of money" name="deposit" id="deposit">
    <br>
   <div class="btn">
      <button class="deposit">Submit</button>
   </div>
</div>    
    <br> 
<br>
<br> 
<br>
<br> 
<br>
<br> 
<br>

    <script src="main.js"></script>
</body>
</html>
